[ds]
path = %(dir)s/ds/DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00001-of-00005.gguf
# DeepSeek-V4.1-Flash, ISTA-DASLab IQ2_XXS (2.00 bpw), chat-tuned: answers through the chat endpoint. The download is 4 shards + a separate Engram file; the 5 files here are the
# converted set (the Engram file is shard 5, key names as the deepseek41 loader reads them): fork tools/ista_to_ds41.py apply|revert DIR, log and original bytes in DIR/ista2ds41.*
url = https://huggingface.co/ISTA-DASLab/DeepSeek-V4.1-Flash-1017-GSQ-RCO-GGUF
att = full 0, swa 40/128, linear 0, topk 512
maxpp = [(48,16384)]
# run -draft N: the DSpark draft (3 layers, 128 experts) in the smaller Q2_K/Q4_K quantization (4.6 GiB; the MXFP4 JigSaw file is 7.4 GiB and took 7.9 GiB of the x4 card's expert cache)
draft = %(dir)s/ds/dspark/Lucebox-DSpark-draft-Q2K-Q4K.dflash.sp.gguf


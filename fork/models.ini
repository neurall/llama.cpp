# Model aliases: [alias] is the name used in run.py (--model, lists in runs/*.csv, regress cells), path = full path to the model file (first part of a split model),
# url = where it comes from (Hugging Face repo page). An empty url = not recorded yet; fill it in, do not guess.
# dir = where the models sit; the paths below are relative to it (%(dir)s). Edit the paths here for your own disks, or add a section for your own model; a section can set its own dir.
# FORK_MODELS_DIR moves all of them at once (default /m).
# Order of lookup: FORK_MODELS_<ALIAS> environment variable, this file, then config.toml / the built-in defaults.

# bestpp = [48=8,24=7]: the best input prompt of the model per total VRAM of the cards in use (GiB = size in thousand tokens): the prompt with the best prompt speed plus decode speed inside the
# range that runs in ONE pass. It depends on your cards, so measure it for yours: `run.py calib -b BUILD -m ALIAS` adds the entry for the VRAM it sees (other entries stay; bestpp_tokens = the real
# token counts). The test best1k uses the entry for your VRAM, and 12k when there is none. Entries copied from someone with other cards do nothing for you.

[olmoe]
path = %(dir)s/o/4/OLMoE-1B-7B-0924-Q4_K_M.gguf
# allenai's file is named in lower case and is 128 bytes smaller than ours (same weights, header differs?): downloaded and saved under our name
# the base model: loops on greedy short prompts; the instruct variant is olmoei
url = https://huggingface.co/allenai/OLMoE-1B-7B-0924-GGUF/resolve/main/olmoe-1b-7b-0924-q4_k_m.gguf

[olmoei]
path = %(dir)s/o/4/OLMoE-1B-7B-0125-Instruct-Q4_K_M.gguf
# chat-tuned: answers through the chat endpoint, does not loop; the model of the gainers olmoe-* rows
url = https://huggingface.co/allenai/OLMoE-1B-7B-0125-Instruct-GGUF/resolve/main/OLMoE-1B-7B-0125-Instruct-Q4_K_M.gguf

[qwen36]
path = %(dir)s/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
url = https://huggingface.co/chtisgit/Qwen3.6-35B-A3B-2Bit-GSQ-hybrid-GGUF

[qn_iq1m]
path = %(dir)s/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
# same size as ISTA-DASLab's Coder variant, shard 1 size matches to the byte
url = https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF/resolve/main/IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf


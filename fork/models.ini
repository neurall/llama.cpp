# Model aliases: [alias] is the name used in run.py (--model, lists in runs/*.csv, regress cells), path = full path to the model file (first part of a split model),
# url = where it comes from (Hugging Face repo page). An empty url = not recorded yet; fill it in, do not guess.
# dir = where the models sit; the paths below are relative to it (%(dir)s). Your own paths and models go in models.local.ini (not committed, same format, read after this file):
# a section with the same alias replaces its path/url, a new section adds a model; [DEFAULT] dir = ... or FORK_MODELS_DIR moves all of ours at once (default /m). FORK_MODELS_INI=file reads that file instead.
# Order of lookup: FORK_MODELS_<ALIAS> environment variable, this file, then the paths in config.toml / the built-in defaults.


; CPU only (no GPU, no cache, no placement): OLMoE-1B-7B Q4_K_M, short prompt, the compilers and releases side by side on the CPU kernels alone
[exp]
name = olmoe-cpu-short
note = CPU-only OLMoE short prompt: stock, b11707, candidate gcc, candidate clang
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off
env = CUDA_VISIBLE_DEVICES=

[arm STOCK-bed0a8566]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

[arm B11707]
bin = /p/bw/rels/b11707-49fe4b756
warm = 1

[arm CAND-GCC]
bin = /p/bw/rels/rc-up-1974e9450
warm = 1

[arm CAND-CLANG]
bin = /p/bw/rels/rc-clang-1974e9450
warm = 1

; final release candidate on pc2 (Zen 2, CPU only): upstream stock built the release way, the previous release b11707, the final clang build, and the final build with the old batch-thread tuner switched back on (what the default-off fix buys)
[exp]
name = olmoe-pc2-final-short
note = final tree 63bde81ac clang 21 pinned against stock 836d57176 (release recipe) and b11707, OLMoE Q4_K_M CPU only, short prompt
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm STOCK-release-recipe]
bin = /home/o/w/rels/stock-docker-836d57176
origin = stock
warm = 1

[arm B11707]
bin = /home/o/w/rels/b11707-49fe4b756
origin = stock

[arm FINAL-clang]
bin = /home/o/w/rels/final-63bde81ac

[arm FINAL-clang-tuner-on]
bin = /home/o/w/rels/final-63bde81ac
env = LLAMA_BATCH_THREAD_AUTOTUNE=1

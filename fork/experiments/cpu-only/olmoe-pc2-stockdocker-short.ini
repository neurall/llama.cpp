; CPU only (no GPU, no cache, no placement): OLMoE-1B-7B Q4_K_M, short prompt, the compilers and releases side by side on the CPU kernels alone
[exp]
name = olmoe-pc2-stockdocker-short
note = CPU-only OLMoE short prompt: stock, b11707, candidate gcc, candidate clang
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm STOCK-native]
bin = /home/o/w/rels/stock-bed0a8566
origin = stock
warm = 1

[arm STOCK-release-recipe]
bin = /home/o/w/rels/stock-docker-bed0a8566
origin = stock
warm = 1

[arm CAND-GCC]
bin = /home/o/w/rels/cpu-gcc-1974e9450
warm = 1

[arm CAND-CLANG]
bin = /home/o/w/rels/cpu-clang-1974e9450
warm = 1

; the official upstream release binary of that commit (llama-b11370-bin-ubuntu-x64.tar.gz, GNU 11.4.0): what users get from the release page
[arm OFFICIAL-ubuntu-b11370]
bin = /home/o/w/rels/official-b11370-ubuntu-x64
origin = stock
warm = 1

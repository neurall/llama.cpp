; GLM 3.0-bit, README t100 prompt through llama-cli with full logs: README's build b11707 against the release candidate, same text (deterministic cache), each arm's own state.
; Question: which settings (threads, ubatch, gate, tuner values, hit rate) differ between the two builds when b11707 runs 26-27.5 t/s and the candidate 25-25.7.
[exp]
name = glm-regress
note = b11707 against the candidate on GLM, README t100 prompt, deterministic, full logs
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
env = LLAMA_MOE_CACHE_DETERMINISTIC=1

[arm B11707]
bin = /p/bw/rels/b11707-49fe4b756
state = /home/o/.claude/jobs/44ecfe4e/tmp/glmreg-state-B.ini

[arm PICKS]
bin = /p/bw/rels/rc-picks-f427df4ce
state = /home/o/.claude/jobs/44ecfe4e/tmp/glmreg-state-P.ini

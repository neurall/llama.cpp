; start-to-finish time of a one-token run on a big model (GLM-5.3-Flash 3.0-bit, 109 GiB), pinned weights with and without the huge-page weights cache:
; round 1 of the cache arm fills the cache file, later rounds map it. The model leaves the page cache before every run.
[exp]
name = ready-time
note = load time with the huge-page pool: pinned from disk each start against GGML_CUDA_HUGEFS (first start fills, later starts map)
rounds = 3
order = fixed

[models]
m = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = hi
n = 1
args = -c 512
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=10 max_swap_mb=8000 swapout_pages_s=400000 psi=60
drop_cache = 1
state = off

[arm PINNED-NO-CACHE-FILE]
bin = /p/bw/rels/release-3db71c4ee

[arm PINNED-HUGEFS]
bin = /p/bw/rels/release-3db71c4ee
env = GGML_CUDA_HUGEFS=/mnt/huge1g

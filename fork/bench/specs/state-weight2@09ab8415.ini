; learned-state experiments on OLMoE (4 GiB, 64 experts x 16 layers) with the VRAM squeezed so about a third of the experts fit, the GLM 3.5-bit ratio (35% in VRAM) at seconds per start.
; question: do the lifetime counts of the learned state (score = window + global-weight x lifetime / max) keep the wrong experts resident? arms: global-weight 16 (default), 4 and 0 on an accumulating state,
; and 16 with a fresh state file at every start. Every arm has a state file of its own (--moe state=FILE), never the user's moe-state.ini. Metric: hit rate and generation t/s per start.
; Hit rate and t/s transfer only partly to GLM (other routing, other bandwidth): a winner is confirmed on GLM 3.5-bit before it goes into a release.
[exp]
name = state-weight2
note = OLMoE, VRAM held to a third resident (ctx 2048, 19.5 GiB held; the first try with 21 GiB left 2 GiB free and every arm fell back to stock): lifetime weight and state freshness
rounds = 12
order = fixed

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = fork/experiments/gains/prompt.txt
n = 200
ctx = 2048
log_verbosity = 4
timeout = 600

[setup]
cuda_visible_devices = 0
hold_vram = 0:19.5
state = keep

[arm GW16]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-GW16.ini
args = --moe global-weight=16

[arm GW4]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-GW4.ini
args = --moe global-weight=4

[arm GW0]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-GW0.ini
args = --moe global-weight=0

[arm FRESH16]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-FRESH16.ini
fresh_state = 1
args = --moe global-weight=16

; same commit, gcc against clang for the CPU backend, with the GPU in play: GLM 3.0-bit, README t100 prompt, deterministic cache; cache off (CPU-bound) and cache on (settled starts)
[exp]
name = gcc-clang-glm
note = candidate built with gcc and with clang, GLM, cache on (3 starts) and cache off
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
env = LLAMA_MOE_CACHE_DETERMINISTIC=1

[arm GCC-on]
bin = /p/bw/rels/rc-up-1974e9450
state = /home/o/.claude/jobs/44ecfe4e/tmp/gc-on-gcc.ini

[arm CLANG-on]
bin = /p/bw/rels/rc-clang-1974e9450
state = /home/o/.claude/jobs/44ecfe4e/tmp/gc-on-clang.ini

[arm GCC-off]
bin = /p/bw/rels/rc-up-1974e9450
args = --moe-expert-cache 0
warm = 1

[arm CLANG-off]
bin = /p/bw/rels/rc-clang-1974e9450
args = --moe-expert-cache 0
warm = 1

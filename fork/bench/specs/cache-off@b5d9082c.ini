; upstream alone: stock before the shared-expert MMVQ fusion (#29184, def4d406a) against stock with it (bed0a8566), GLM 3.0-bit, README t100 prompt, llama-cli.
; If stock itself drops here, the ~4% decode gap of the fork against README's b11707 build is upstream's.
[exp]
name = cache-off
note = cache off on GLM: b11707 (--moe-expert-cache 0), the candidate with --fork off, stock bed0a8566; the shared decode path without cache noise
rounds = 2
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95

[arm B11707-cache0]
bin = /p/bw/rels/b11707-49fe4b756
args = --moe-expert-cache 0
warm = 1

[arm F-offcand]
bin = /p/bw/rels/rc-up-1974e9450
args = --fork off
warm = 1

[arm S-bed0a8566]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

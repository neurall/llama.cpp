# Prompts of the run.py tests. [name] = the prompt's acronym (also a test name where one exists), path = full path of the input file (default dir: fork/prompts;
# FORK_PROMPTS_DIR moves them all). strip = 1: the file's trailing newline is not part of the prompt (the .txt files); lines = 1: one prompt per line (rotated by repetition).
# in = what the status line says about the test's prompt size. A test alias: alias = the real test, tokens = answer length, prefix = prompt section prepended, snippet = prompt section sent instead of the default source.

[DEFAULT]
dir = %(here)s

[src128k]
path = %(dir)s/src_128k.cpp
in = 128k

[src12k]
path = %(dir)s/src_12k.cpp
in = 12k

[src3k]
path = %(dir)s/src_3k.cpp
in = 3k

[src1k]
path = %(dir)s/src_1k.cpp
in = 1k

[longsrc]
path = %(dir)s/longsrc.cpp
in = 2048

[tetris]
path = %(dir)s/prompt-tetris.txt
strip = 1
in = 64

[game_template]
path = %(dir)s/prompt-game-template.txt
strip = 1

[game_words]
path = %(dir)s/prompt-game-words.txt
lines = 1

[game_warm]
path = %(dir)s/prompt-game-warm.txt
strip = 1

[bug_instr]
path = %(dir)s/prompt-bug-instr.txt
strip = 1

[edit_instr]
path = %(dir)s/prompt-edit-instr.txt
lines = 1

[edit_warm]
path = %(dir)s/prompt-edit-warm.txt
strip = 1

[chat_long]
path = %(dir)s/prompt-chat-long.txt
strip = 1

[chatv]
path = %(dir)s/prompt-chatv.txt
lines = 1
in = 10-36

[code_review]
path = %(dir)s/prompt-code-review.txt

# tests: the status line's prompt size, and the aliases
[pf12k1k]
alias = pf12k
tokens = 1024
prefix = code_review
in = 12k

[12kin_1kout_code_review]
alias = pf12k
tokens = 1024
prefix = code_review

[1kin_1kout_edit_src]
alias = edit4c
tokens = 1024
snippet = src1k
in = 1k

[1kout_make_game]
alias = game4c
tokens = 1024
in = 64

[test-pf12k]
in = 12k

[test-pf128k]
in = 128k

[test-long1k]
in = 1k

[test-edit4c]
in = 3k

[test-chat2]
in = 350

[test-tetrisc]
in = 64

[test-t100]
in = 64

[test-chat]
in = 64

[test-game4c]
in = 64

[test-pf12k-stock]
in = 12k

[test-fix12k]
in = 12k

[test-agent]
in = agent loop, code prompts

[test-ppl]
in = 2048

[test-ppl3]
in = 2048

[test-pplc]
in = 2048

# Your own prompt as a test: add a section (here, or in prompts.local.ini next to this file, which git ignores), then `run bench -t mine` or a row `test = mine` in fork/runs/*.csv.
#   [mine]
#   path = /home/me/prompts/review.txt
#   test = chat              # chat = /v1/chat/completions with the model's template, completion = raw /completion
#   tokens = 512             # answer length
#   ctx = 8192               # context for the server
#   in = 2k                  # shown in the status line and the results
#   strip = 1                # the file's trailing newline is not part of the prompt

# One-pass input prompts: the first N thousand tokens of the 12k source, cut by characters in proportion (the 12k file is 12294 tokens for GLM, 4.4 characters each), so every model
# reads the same text and each size is a frozen file. A model's best size (the biggest that runs in ONE pass at its best prompt speed) is best_prompt in models.ini; the test
# pfbest1k resolves to pf<N>k1k per model (run.py best_test); `run.py onepass` measures it.

[src2k]
path = %(dir)s/src_2k.cpp
in = 2k

[pf2k1k]

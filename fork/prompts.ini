# Prompts of the run.py tests. [name] = the prompt's acronym (also a test name where one exists), path = full path of the input file (default dir: fork/prompts;
# FORK_PROMPTS_DIR moves them all). strip = 1: the file's trailing newline is not part of the prompt (the .txt files); lines = 1: one prompt per line (rotated by repetition).
# in = what the status line says about the test's prompt size. A test alias: alias = the real test, tokens = answer length, prefix = prompt section prepended, snippet = prompt section sent instead of the default source.

[DEFAULT]
dir = %(here)s

[src128k]
path = %(dir)s/src_128k.cpp
in = 128k

[src12k]
path = %(dir)s/src_12k.cpp
in = 12k

[src3k]
path = %(dir)s/src_3k.cpp
in = 3k

[src1k]
path = %(dir)s/src_1k.cpp
in = 1k

[longsrc]
path = %(dir)s/longsrc.cpp
in = 2048

[tetris]
path = %(dir)s/prompt-tetris.txt
strip = 1
in = 64

[game_template]
path = %(dir)s/prompt-game-template.txt
strip = 1

[game_words]
path = %(dir)s/prompt-game-words.txt
lines = 1

[game_warm]
path = %(dir)s/prompt-game-warm.txt
strip = 1

[bug_instr]
path = %(dir)s/prompt-bug-instr.txt
strip = 1

[edit_instr]
path = %(dir)s/prompt-edit-instr.txt
lines = 1

[edit_warm]
path = %(dir)s/prompt-edit-warm.txt
strip = 1

[chat_long]
path = %(dir)s/prompt-chat-long.txt
strip = 1

[chatv]
path = %(dir)s/prompt-chatv.txt
lines = 1
in = 10-36

[code_review]
path = %(dir)s/prompt-code-review.txt

# tests: the status line's prompt size, and the aliases
[pf12k1k]
alias = pf12k
tokens = 1024
prefix = code_review
in = 12k

[12kin_1kout_code_review]

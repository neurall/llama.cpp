; Qwen3.8 Next IQ3_S on PC1 (published b12030 archive): the README row says 57.1 with the cache against stock 43.9; the first b12030 run gave 41.9.
; placement forced each way against the default decision, upstream stock and b11707, one session, own state file per fork arm
[exp]
name = iq3s-diag
note = IQ3_S: is the 41.9 a placement decision (forced cache should reach ~57) or the code/compiler (forced cache stays ~42)
rounds = 3
order = rotate
warm = 1

[models]
m = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 2400

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm STOCK]
bin = /p/bw/rels/stock-docker-836d57176
origin = stock

[arm B11707]
bin = /p/bw/rels/b11707-49fe4b756
state = /tmp/iq3s-st-b11707.ini

[arm REL-default]
bin = /p/bw/rels/release-ac2e8344b
state = /tmp/iq3s-st-default.ini

[arm REL-forced-cache]
bin = /p/bw/rels/release-ac2e8344b
env = LLAMA_MOE_AUTO_MODE=cache
state = /tmp/iq3s-st-cache.ini

[arm REL-forced-stock]
bin = /p/bw/rels/release-ac2e8344b
env = LLAMA_MOE_AUTO_MODE=stock
state = /tmp/iq3s-st-stock.ini

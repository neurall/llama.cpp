; the fork's mid-split rule (new split when an activation from another GPU is needed) makes 4 splits where stock makes 3 on Qwen Next: is it the 1.5% generation gap?
; SPLIT-ON = default, SPLIT-OFF = GGML_SCHED_NO_MIDSPLIT=1, same build, --fork off; S2-CLI = stock. All llama-cli.
[exp]
name = midsplit
note = mid-split rule on/off on one build, --fork off, Qwen Next; log shows the split count
rounds = 5
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
q36 = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf

[workload]
tool = cli
prompt_file = tools/experiments/midsplit/prompt.txt
n = 200
log_verbosity = 4

[setup]
guard = min_avail_gb=30 max_swap_mb=4000

[arm SPLIT-ON]
bin = /p/bw/wt-release-next/build-dev/bin
args = --fork off
warm = 1

[arm SPLIT-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --fork off
env = GGML_SCHED_NO_MIDSPLIT=1
warm = 1

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

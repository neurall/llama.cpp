; retest of the prefill regressions (Qwen Next 3x, GLM 26%, Qwen3.6 5% slower than b11707 and stock).
; M = the measuring build, R = the build before it, P = b11707, S = stock. One state file, fresh at the start: starts 1-2 of M and R measure,
; later starts run the faster placement; decisions column shows what each start chose.
[exp]
name = placement-measure
note = measure-placement build vs the build before it, b11707 and stock at n=100
rounds = 5
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
q36 = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/placement-measure/prompt.txt
n = 100
log_verbosity = 4

[setup]
state = /home/o/.claude/jobs/44ecfe4e/tmp/placement-measure-state.ini
guard = min_avail_gb=40 max_swap_mb=1500

[arm M]
bin = /p/bw/wt-release-next/build-dev/bin

[arm R]
bin = /p/bw/rels/rn-before-measure

[arm S]
bin = /p/bw/rels/stock-def4d406a
tool = completion
origin = stock

[arm P]
bin = /p/bw/rels/b11707-49fe4b756

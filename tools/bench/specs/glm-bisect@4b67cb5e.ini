; GLM 3.0-bit, README t100 prompt through llama-cli, deterministic cache (same text every run): the stored builds from README's b11707 to the candidate, oldest first.
; The first build whose settled speed drops brackets the cause (b11707 ~26-27.5 t/s on this test through the server, candidate ~25).
[exp]
name = glm-bisect
note = stored builds b11707 to candidate on GLM, README t100 prompt, deterministic, one state per arm
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
env = LLAMA_MOE_CACHE_DETERMINISTIC=1

[arm A-b11707]
bin = /p/bw/rels/b11707-49fe4b756
state = /home/o/.claude/jobs/44ecfe4e/tmp/bis-A.ini

[arm B-bfa0ec35d]
bin = /p/bw/rels/rn-before-measure
state = /home/o/.claude/jobs/44ecfe4e/tmp/bis-B.ini

[arm C-43c979eb9]
bin = /p/bw/rels/rc-merge-43c979eb9
state = /home/o/.claude/jobs/44ecfe4e/tmp/bis-C.ini

[arm D-fd4c3d2d3]
bin = /p/bw/rels/rc-final-fd4c3d2d3
state = /home/o/.claude/jobs/44ecfe4e/tmp/bis-D.ini

[arm E-f427df4ce]
bin = /p/bw/rels/rc-picks-f427df4ce
state = /home/o/.claude/jobs/44ecfe4e/tmp/bis-E.ini

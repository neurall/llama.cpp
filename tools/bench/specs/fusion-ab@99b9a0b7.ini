; is upstream's shared-expert MMVQ fusion (#29184) what makes stock 14% faster on prompt, and does it fire in our build?
; stock native (S2): fusion on vs GGML_CUDA_DISABLE_FUSION=1; our build with the fork off (M-OFF): the same. If M-OFF does not change when fusion is
; disabled while S2 drops to about 900, the fusion is not firing in our tree.
[exp]
name = fusion-ab
note = GGML_CUDA_DISABLE_FUSION on and off, stock native and our build
rounds = 4
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/fusion-ab/prompt.txt
n = 100
log_verbosity = 4

[setup]
state = off
guard = min_avail_gb=40 max_swap_mb=1500

[arm S2]
bin = /p/bw/rels/stock-bed0a8566
tool = completion
origin = stock

[arm S2-NOFUSE]
bin = /p/bw/rels/stock-bed0a8566
tool = completion
origin = stock
env = GGML_CUDA_DISABLE_FUSION=1

[arm M-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --moe cache=0

[arm M-OFF-NOFUSE]
bin = /p/bw/wt-release-next/build-dev/bin
args = --moe cache=0
env = GGML_CUDA_DISABLE_FUSION=1

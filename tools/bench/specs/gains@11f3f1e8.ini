; models the fork gained on before (README table), final rc-merge build, 2 x RTX 3090, every arm llama-cli, -n 200.
; RC = default fork with its own state file: 6 starts, the first starts measure stock and cache (the hot settled starts are the gain), S2-CLI = stock bed0a8566 (one cold run recorded as temp=cold).
; Models bigger than RAM (GLM 3.5-bit 128 GB, MiMo 132 GB) are a separate, careful step (swap guard, earlier freezes).
[exp]
name = gains
note = default fork against stock on the models that gained before: Qwen3.8-Flash-Next IQ4_XS (88 GB) and IQ3_S (83 GB)
rounds = 6
order = fixed

[models]
iq4xs = /m/q/4/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
iq3s = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/gains/prompt.txt
n = 200
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=30 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

[arm RC]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/gains-state-RC.ini
free_cache = 1

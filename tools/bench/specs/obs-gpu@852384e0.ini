; heat observer on stock-placement starts, IQ4_XS (cache wins here): GPU counters (e29cff35c) against CPU-only counters (rc-obs-499914d7f) against observer off.
; Each arm has its own state file, reset at the start; rounds are consecutive starts of one state, so round 2 is the first cache trial from a saved profile.
[exp]
name = obs-gpu
note = observer heat counters on the GPU vs CPU-only vs off, IQ4_XS starts 1-4 with fresh state
rounds = 4
order = fixed

[models]
iq4xs = /m/q/4/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf

[workload]
tool = cli
prompt = Write a Python function that checks whether a number is prime, with a short explanation.
n = 200
log_verbosity = 4
timeout = 2400

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95

[arm GPU]
bin = /p/bw/rels/rc-obsgpu-e29cff35c
state = /home/o/.claude/jobs/44ecfe4e/tmp/obsgpu-state-GPU.ini

[arm CPU]
bin = /p/bw/rels/rc-obs-499914d7f
state = /home/o/.claude/jobs/44ecfe4e/tmp/obsgpu-state-CPU.ini

[arm OFF]
bin = /p/bw/rels/rc-obsgpu-e29cff35c
env = LLAMA_MOE_OBSERVE=0
state = /home/o/.claude/jobs/44ecfe4e/tmp/obsgpu-state-OFF.ini

; hugetlbfs weights cache on the 1 GiB pool: the first start fills /mnt/huge1g from the model file, the next starts map the cache (no file read).
; (file read every start), wall time = load + run of 100 tokens. Compare with the same arm without a pool (rc-glm-hot: wall 94-124 s, 26 s populate+register).
[exp]
name = rc-hugefs
note = default fork on GLM, 1 GiB pool plus the hugetlbfs weights cache: start 1 fills it, later starts skip the file read
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/rc-pool1g/prompt.txt
n = 100
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=8 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm HUGEFS]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/rc-state-hugefs.ini
env = GGML_CUDA_HUGEFS=/mnt/huge1g

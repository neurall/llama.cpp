; which models does the fork's gate fusion ever fire on? one start each with the log line (build a98572478), default fork, learned state off. The log shows "gate fusion ... fires" once per process.
[exp]
name = gate-log
note = does the gate fusion fire: one start per model, grep the log
rounds = 1
order = fixed

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

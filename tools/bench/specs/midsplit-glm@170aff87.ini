; does the fork's mid-split rule help the expert cache on GLM (2 x 3090)? Default fork (cache decided by measuring), rule on vs GGML_SCHED_NO_MIDSPLIT=1, own state file per arm,
; -n 200 so the placement decision settles sooner. Pinned weights from the fallback loader (no pool), page cache of the file released before each start.
[exp]
name = midsplit-glm
note = mid-split rule on/off on the default fork, GLM, cache path
rounds = 6
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/midsplit-glm/prompt.txt
n = 200
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=60 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm SPLIT-ON]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/ms-state-on.ini
free_cache = 1

[arm SPLIT-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/ms-state-off.ini
env = GGML_SCHED_NO_MIDSPLIT=1
free_cache = 1

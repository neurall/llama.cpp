; GLM-5.3-Flash 3.0-bit with a reserved 2 MiB hugepage pool (sysctl vm.nr_hugepages, 34989 pages = 68.3 GiB were allocated at runtime; 1 GiB pages are not possible
; after this uptime). RC-POOL = default fork, pinned buffer from the pool; compare with the same arm without a pool in rc-glm-hot (wall 94-124 s, populate 11.3 s,
; register 14.3 s, 40 GiB THP + 28 GiB small pages).
[exp]
name = rc-pool
note = default fork on GLM, pinned buffer from a reserved 2 MiB pool
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/rc-pool/prompt.txt
n = 100
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=20 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm RC-POOL]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/rc-state-pool.ini
free_cache = 1

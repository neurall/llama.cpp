; final rc-merge (adaf67d4a) on GLM-5.3-Flash 3.0-bit with a 100 x 1 GiB pool (pool.sh mount 100G right after boot). POOL = the pinned buffer comes from the reserved pool
; (file read every start), wall time = load + run of 100 tokens. Compare with the same arm without a pool (rc-glm-hot: wall 94-124 s, 26 s populate+register).
[exp]
name = rc-pool1g
note = default fork on GLM with the 1 GiB pool, file read each start
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/rc-pool1g/prompt.txt
n = 100
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=8 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm POOL]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/rc-state-pool1g.ini
free_cache = 1

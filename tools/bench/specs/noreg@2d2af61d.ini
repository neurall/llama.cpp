; our pinned-memory loader registers every host buffer >= 1 GiB (mmap + THP + cudaHostRegister), including the 1 GiB CUDA_Host compute buffer that stock
; allocates with cudaMallocHost. nsys: GPU kernel time equal to stock, but 30% more launches and 100 ms more memcpy time on a Qwen3.6 prompt.
; M-OFF = the build as it was, M-OFF-NOREG = same build with GGML_CUDA_NO_REGISTERED=1 (plain cudaMallocHost), S2 = native stock.
[exp]
name = noreg
note = registered host buffer vs cudaMallocHost for the compute buffer
rounds = 4
order = rotate

[models]
q36 = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/noreg/prompt.txt
n = 100
log_verbosity = 4

[setup]
state = off
guard = min_avail_gb=40 max_swap_mb=1500

[arm S2]
bin = /p/bw/rels/stock-bed0a8566
tool = completion
origin = stock

[arm M-OFF]
bin = /p/bw/rels/rn-measure-before-noreg
args = --moe cache=0

[arm M-OFF-NOREG]
bin = /p/bw/wt-release-next/build-dev/bin
args = --moe cache=0
env = GGML_CUDA_NO_REGISTERED=1

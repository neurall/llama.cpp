; models bigger than the 125 GB of RAM (README: GLM 3.5-bit 128 GB 2.2x, MiMo IQ3_XXS 132 GB 2.4x): the weights stream from disk through the page cache, no pinning (it does not fit).
; Default fork (own state file, 6 starts) against stock, same tool, -n 200. The guard watches swap-out only (memory pressure is high by design when the file is bigger than RAM).
[exp]
name = gains-big
note = default fork against stock on models bigger than RAM: GLM 3.5-bit and MiMo IQ3_XXS
rounds = 6
order = fixed

[models]
glm35 = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.5bit.gguf
mimo = /m/m/3/MiMo-V2.6-Flash-RL-IQ3_XXS-00001-of-00008.gguf

[workload]
tool = cli
prompt_file = tools/experiments/gains/prompt.txt
n = 200
log_verbosity = 4
timeout = 2400

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

[arm RC]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/gains-big-state-RC.ini

; topic switch: phase A trains the learned state on a tech prompt, phase B runs a cooking prompt on the kept state: do the lifetime counts keep the old topic's experts resident (global-weight 16, 4, 0)?
; fresh = an empty state at every start (reference). OLMoE squeezed to a third resident, see spec.ini.
[exp]
name = state-poison-b
note = OLMoE topic switch, phase B
rounds = 8
order = fixed

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = tools/experiments/state-weight/prompt-b.txt
n = 200
ctx = 2048
log_verbosity = 4
timeout = 600

[setup]
cuda_visible_devices = 0
hold_vram = 0:19.5
state = keep

[arm GW16]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-GW16.ini
keep_state = 1
args = --moe global-weight=16

[arm GW4]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-GW4.ini
keep_state = 1
args = --moe global-weight=4

[arm GW0]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-GW0.ini
keep_state = 1
args = --moe global-weight=0

[arm FRESH16]
bin = /p/bw/rels/release-b12230
state = /home/o/.claude/jobs/44ecfe4e/tmp/sw-FRESH16.ini
fresh_state = 1
keep_state = 1
args = --moe global-weight=16

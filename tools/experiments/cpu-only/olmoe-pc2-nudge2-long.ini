; CPU only (no GPU, no cache, no placement): OLMoE-1B-7B Q4_K_M, long prompt, the compilers and releases side by side on the CPU kernels alone
[exp]
name = olmoe-pc2-nudge2-long
note = CPU-only OLMoE long prompt: stock, b11707, candidate gcc, candidate clang
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_3k.cpp
n = 32
args = -c 4096 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm OFFICIAL-ubuntu-b11370]
bin = /home/o/w/rels/official-b11370-ubuntu-x64
origin = stock
warm = 1

[arm ts11-plain]
bin = /home/o/w/rels/ts11-25ccd52d0
warm = 1

[arm ts11-unroll]
bin = /home/o/w/rels/ts11-unroll-25ccd52d0
warm = 1

[arm ts11-tunehsw]
bin = /home/o/w/rels/ts11-tunehsw-25ccd52d0
warm = 1

[arm ts11-tunehsw-unroll]
bin = /home/o/w/rels/ts11-tunehsw-unroll-25ccd52d0
warm = 1

[arm clang-plain]
bin = /home/o/w/rels/clang-plain-25ccd52d0
warm = 1

[arm clang-unroll]
bin = /home/o/w/rels/clang-unroll-25ccd52d0
warm = 1

[arm clang-tunehsw]
bin = /home/o/w/rels/clang-tunehsw-25ccd52d0
warm = 1

[arm clang-tunehsw-unroll]
bin = /home/o/w/rels/clang-tunehsw-unroll-25ccd52d0
warm = 1

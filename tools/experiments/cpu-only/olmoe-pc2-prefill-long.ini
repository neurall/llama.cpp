; the fork's long-prompt prefill cost on the CPU alone (pc2, OLMoE, 2700 tokens): stock gcc 11 148 against candidate gcc 11 140 prompt t/s. Which part: its own settings (--fork off, autotune off) or compiled-in code?
[exp]
name = olmoe-pc2-prefill-long
note = long prompt prefill: stock against the candidate with fork off and autotune off, gcc 11
rounds = 6
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_3k.cpp
n = 32
args = -c 4096 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm STOCK-gcc11]
bin = /home/o/w/rels/gcc11-stock
origin = stock
warm = 1

[arm CAND-gcc11]
bin = /home/o/w/rels/gcc11-cand
warm = 1

[arm CAND-gcc11-forkoff]
bin = /home/o/w/rels/gcc11-cand
args = --fork off
warm = 1

[arm CAND-gcc11-autotune-off]
bin = /home/o/w/rels/gcc11-cand
env = LLAMA_AUTOTUNE=0
warm = 1

[arm CAND-gcc11-ub512-t6]
bin = /home/o/w/rels/gcc11-cand
args = -ub 512 -b 2048 -t 6 -tb 6
warm = 1

[arm STOCK-gcc11-ub512-t6]
bin = /home/o/w/rels/gcc11-stock
origin = stock
args = -ub 512 -b 2048 -t 6 -tb 6
warm = 1

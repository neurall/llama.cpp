; pc2, Qwen3.6 Q2_0 CPU only, long prompt processing (3409 tokens, one generated token): the published b12030 against b11707 and against its own OpenMP runtime settings
; (libomp barrier waits took 15.7% of the time against 5.4% in libgomp for b11707)
[exp]
name = readme-pc2-qwen36-omp
note = published b12030 prompt processing with libomp environment settings against b11707
rounds = 2
order = rotate
warm = 1

[models]
m = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_3k.cpp
n = 1
args = -c 4096 -dev none -ngl 0
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm B11707]
bin = /home/o/w/rels/b11707-49fe4b756
origin = stock

[arm PUB-b12030]
bin = /home/o/w/rels/pub-b12030

[arm PUB-blocktime0]
bin = /home/o/w/rels/pub-b12030
env = KMP_BLOCKTIME=0

[arm PUB-blocktime-inf]
bin = /home/o/w/rels/pub-b12030
env = KMP_BLOCKTIME=infinite

[arm PUB-active]
bin = /home/o/w/rels/pub-b12030
env = OMP_WAIT_POLICY=active

; CPU only (no GPU, no cache, no placement): OLMoE-1B-7B Q4_K_M, long prompt, the compilers and releases side by side on the CPU kernels alone
[exp]
name = olmoe-pc2-long
note = CPU-only OLMoE long prompt: stock, b11707, candidate gcc, candidate clang
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_3k.cpp
n = 32
args = -c 4096 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm STOCK-bed0a8566]
bin = /home/o/w/rels/stock-bed0a8566
origin = stock
warm = 1

[arm B11707]
bin = /home/o/w/rels/b11707-49fe4b756
warm = 1

[arm GCC]
bin = /home/o/w/rels/cpu-gcc-1974e9450
warm = 1

[arm GCC-BLAS]
bin = /home/o/w/rels/cpu-gcc-blas-1974e9450
warm = 1

[arm CLANG]
bin = /home/o/w/rels/cpu-clang-1974e9450
warm = 1

[arm CLANG-BLAS]
bin = /home/o/w/rels/cpu-clang-blas-1974e9450
warm = 1

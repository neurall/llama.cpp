; pc2 (Ryzen 5 3600, CPU only), Qwen3.6-35B Q2_0, short tetris prompt: release 3db71c4ee was 3.5% (gen) and 19% (prompt) below b11707. Same cell again plus the two suspects:
; the batch thread tuner (off by default now, on in b11707) and the compiler (clang 21 here, gcc 13 in b11707; GCC11 = the same tree built with gcc 11)
[exp]
name = readme-pc2-qwen36-diag
note = pc2 Qwen3.6 CPU only: b11707 against release, release with the batch tuner on, same tree with gcc 11
rounds = 3
order = rotate
warm = 1

[models]
m = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024 -dev none -ngl 0
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm B11707]
bin = /home/o/w/rels/b11707-49fe4b756
origin = stock

[arm RELEASE]
bin = /home/o/w/rels/release-3db71c4ee

[arm RELEASE-tuner-on]
bin = /home/o/w/rels/release-3db71c4ee
env = LLAMA_BATCH_THREAD_AUTOTUNE=1

[arm GCC11-same-tree]
bin = /home/o/w/rels/gcc11-candfix2

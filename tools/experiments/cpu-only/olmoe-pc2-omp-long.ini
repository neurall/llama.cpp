; CPU only (no GPU, no cache, no placement): OLMoE-1B-7B Q4_K_M, long prompt, the compilers and releases side by side on the CPU kernels alone
[exp]
name = olmoe-pc2-omp-long
note = CPU-only OLMoE long prompt: stock, b11707, candidate gcc, candidate clang
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_3k.cpp
n = 32
args = -c 4096 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm OFFICIAL]
bin = /home/o/w/rels/official-b11370-ubuntu-x64
origin = stock
warm = 1

[arm gcc11-libgomp]
bin = /home/o/w/rels/ts11-25ccd52d0
warm = 1

[arm gcc11-libomp]
bin = /home/o/w/rels/ts11-25ccd52d0
env = LD_PRELOAD=/home/o/w/rels/cpu-clang-1974e9450/libomp.so
warm = 1

[arm gcc13-libgomp]
bin = /home/o/w/rels/ts13-25ccd52d0
warm = 1

[arm gcc13-libomp]
bin = /home/o/w/rels/ts13-25ccd52d0
env = LD_PRELOAD=/home/o/w/rels/cpu-clang-1974e9450/libomp.so
warm = 1

[arm gcc13-libgomp-active]
bin = /home/o/w/rels/ts13-25ccd52d0
env = OMP_WAIT_POLICY=active
warm = 1

[arm clang-libomp]
bin = /home/o/w/rels/clang-pinned-25ccd52d0
warm = 1

[arm clang-libomp-passive]
bin = /home/o/w/rels/clang-pinned-25ccd52d0
env = OMP_WAIT_POLICY=passive
warm = 1

; the missing cell of the 2x2: clang codegen on the GNU runtime (built with -fopenmp=libgomp)
[arm clang-libgomp]
bin = /home/o/w/rels/clang-gomp-25ccd52d0
warm = 1

[arm clang-libgomp-active]
bin = /home/o/w/rels/clang-gomp-25ccd52d0
env = OMP_WAIT_POLICY=active
warm = 1

; no OpenMP at all: ggml's own thread pool (GGML_OPENMP=OFF), three compilers
[arm gcc11-noomp]
bin = /home/o/w/rels/noomp-ts11-25ccd52d0
warm = 1

[arm gcc13-noomp]
bin = /home/o/w/rels/noomp-ts13-25ccd52d0
warm = 1

[arm clang-noomp]
bin = /home/o/w/rels/noomp-clang-25ccd52d0
warm = 1

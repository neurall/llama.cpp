; the batch-thread tuner fix: six consecutive starts per arm with a state file of its own (round 1 = first start, may explore; later rounds start from the saved count).
; Prompt processing of the 2700-token prompt, OLMoE Q4_K_M on pc2, gcc 11.4 builds: stock against the candidate before and after the fix.
[exp]
name = olmoe-pc2-tunerfix-long
note = batch thread tuner fix: stock, candidate (old), candidate (fixed), consecutive starts with state
rounds = 6
order = fixed

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_3k.cpp
n = 32
args = -c 4096 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95

[arm STOCK-gcc11]
bin = /home/o/w/rels/gcc11-stock
origin = stock
warm = 0

[arm CAND-gcc11-old]
bin = /home/o/w/rels/gcc11-cand
state = /home/o/w/st-old.ini

[arm CAND-gcc11-fixed]
bin = /home/o/w/rels/gcc11-candfix
state = /home/o/w/st-fixed.ini

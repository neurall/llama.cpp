; CPU only (no GPU, no cache, no placement): OLMoE-1B-7B Q4_K_M, short prompt, the compilers and releases side by side on the CPU kernels alone
[exp]
name = olmoe-pc2-omp-short
note = CPU-only OLMoE short prompt: stock, b11707, candidate gcc, candidate clang
rounds = 5
order = rotate

[models]
olmoe = /m/o/8/4/OLMoE-1B-7B-0924-Instruct-Q4_K_M.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024 -dev none -ngl 0
log_verbosity = 4
timeout = 600

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
state = off

[arm OFFICIAL]
bin = /home/o/w/rels/official-b11370-ubuntu-x64
origin = stock
warm = 1

[arm gcc11-libgomp]
bin = /home/o/w/rels/ts11-25ccd52d0
warm = 1

[arm gcc11-libomp]
bin = /home/o/w/rels/ts11-25ccd52d0
env = LD_PRELOAD=/home/o/w/rels/cpu-clang-1974e9450/libomp.so
warm = 1

[arm gcc13-libgomp]
bin = /home/o/w/rels/ts13-25ccd52d0
warm = 1

[arm gcc13-libomp]
bin = /home/o/w/rels/ts13-25ccd52d0
env = LD_PRELOAD=/home/o/w/rels/cpu-clang-1974e9450/libomp.so
warm = 1

[arm gcc13-libgomp-active]
bin = /home/o/w/rels/ts13-25ccd52d0
env = OMP_WAIT_POLICY=active
warm = 1

[arm clang-libomp]
bin = /home/o/w/rels/clang-pinned-25ccd52d0
warm = 1

[arm clang-libomp-passive]
bin = /home/o/w/rels/clang-pinned-25ccd52d0
env = OMP_WAIT_POLICY=passive
warm = 1

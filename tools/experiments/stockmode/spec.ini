; the fork's "stock placement" start is not identical to stock: threads 6 against 8, context 32768 against stock's default, pinned weights, auto ubatch. Which of them costs the 0.6-1.5% on Qwen Next IQ1_M (picks stock)?
; every fork arm has the placement forced to stock (LLAMA_MOE_AUTO_MODE=stock), so only the settings differ; S2-CLI = stock. All llama-cli, hot.
[exp]
name = stockmode
note = fork stock placement vs stock: threads and context isolated, Qwen Next IQ1_M
rounds = 4
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/stockmode/prompt.txt
n = 200
log_verbosity = 4

[setup]
state = off
guard = min_avail_gb=30 max_swap_mb=4000

[arm F]
bin = /p/bw/rels/rc-final-fd4c3d2d3
env = LLAMA_MOE_AUTO_MODE=stock

[arm F-T8]
bin = /p/bw/rels/rc-final-fd4c3d2d3
args = -t 8 -tb 8
env = LLAMA_MOE_AUTO_MODE=stock

[arm F-C4096]
bin = /p/bw/rels/rc-final-fd4c3d2d3
args = -c 4096
env = LLAMA_MOE_AUTO_MODE=stock

[arm F-T8-C4096]
bin = /p/bw/rels/rc-final-fd4c3d2d3
args = -t 8 -tb 8 -c 4096
env = LLAMA_MOE_AUTO_MODE=stock

[arm F-NOPIN]
bin = /p/bw/rels/rc-final-fd4c3d2d3
args = -lm mmap
env = LLAMA_MOE_AUTO_MODE=stock

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

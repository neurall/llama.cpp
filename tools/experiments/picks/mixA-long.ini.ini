; mixed workload on one shared state (picks build): the first part resets the state, the second continues it, so the picks must follow the change
[exp]
name = mixA-long
note = placement picks with the workload changing, shared state
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_12k.cpp
n = 32
log_verbosity = 4
timeout = 2400

[setup]
guard = min_avail_gb=60 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm PICKS]
bin = /p/bw/rels/rc-picks-f427df4ce
args = -c 16384 -ub 2048 -b 2048
env = LLAMA_MOE_STATE=/home/o/.claude/jobs/44ecfe4e/tmp/mixA-state.ini

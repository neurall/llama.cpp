; picks build against stock on GLM 3.0-bit, long prompt: each run records the better-prefill and better-generation pick, the start follows the request shape
[exp]
name = picks-long
note = placement picks, long prompt, against stock
rounds = 4
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/bench/src_12k.cpp
n = 32

log_verbosity = 4
timeout = 2400

[setup]
guard = min_avail_gb=60 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm S2-CLI]
args = -c 16384 -ub 2048 -b 2048
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

[arm PICKS]
args = -c 16384 -ub 2048 -b 2048
bin = /p/bw/rels/rc-picks-f427df4ce
state = /home/o/.claude/jobs/44ecfe4e/tmp/picks-long-state.ini

; release-next prompt processing is 3x slower than b11707 on Qwen Next (301 vs 913 t/s), 26% on GLM, ~5% on Qwen3.6; stock is as fast as b11707.
; Which setting decides it: the ubatch the fork picks, the cache, or the op offload?
[exp]
name = prefill-regression
note = prompt t/s of release-next vs its own switches vs b11707 and stock
rounds = 3
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/prefill-regression/prompt.txt
n = 16

[setup]
state = off
guard = min_avail_gb=40 max_swap_mb=1500

[arm D]
bin = /p/bw/wt-release-next/build-dev/bin

[arm UB2048]
bin = /p/bw/wt-release-next/build-dev/bin
args = -ub 2048

[arm ATOFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = -at off

[arm NOCACHE]
bin = /p/bw/wt-release-next/build-dev/bin
args = --moe-expert-cache 0

[arm NOOFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --no-op-offload

[arm P]
bin = /p/bw/rels/b11707-49fe4b756

; Qwen Next IQ1_M on PC1: release-next default vs fewer compute threads (upload workers get their own cores) vs the previous release
[exp]
name = qn-threads
note = release-next 20% slower than b11707 on Qwen Next; do upload workers compete with the 8 compute threads (MichaelDietzel, #27861)
rounds = 3
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/qn-threads/prompt.txt
n = 100

[setup]
state = off
guard = min_avail_gb=40 max_swap_mb=1500

[arm D]
bin = /p/bw/wt-release-next/build-dev/bin

[arm T7]
bin = /p/bw/wt-release-next/build-dev/bin
args = -t 7

[arm T6]
bin = /p/bw/wt-release-next/build-dev/bin
args = -t 6

[arm P]
bin = /p/bw/rels/b11707-49fe4b756

; upstream alone: stock before the shared-expert MMVQ fusion (#29184, def4d406a) against stock with it (bed0a8566), GLM 3.0-bit, README t100 prompt, llama-cli.
; If stock itself drops here, the ~4% decode gap of the fork against README's b11707 build is upstream's.
[exp]
name = stock-pair
note = stock def4d406a against bed0a8566 on GLM, README t100 prompt
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95

[arm S-def4d406a]
bin = /p/bw/rels/stock-def4d406a
origin = stock
warm = 1

[arm S-bed0a8566]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

; upstream's own switch for all CUDA graph fusions (the shared-expert MMVQ fusion #29184 among them): stock bed0a8566 with it off isolates the fusions without a rebuild
[arm S-bed-nofuse]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
env = GGML_CUDA_DISABLE_FUSION=1
warm = 1

; the merged candidate with --fork off: stock behaviour with the fork's compiled-in code (scheduler, CUDA, graph): its cost against stock bed0a8566 is what the compiled-in fork changes cost
[arm F-offcand]
bin = /p/bw/rels/rc-up-1974e9450
args = --fork off
warm = 1

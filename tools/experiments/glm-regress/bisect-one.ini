; one build of the git bisect (tools/bisect_glm.sh): GLM 3.0-bit, README t100 prompt, deterministic cache, fresh state, 3 starts; the third (settled) start is the verdict
[exp]
name = @NAME@
note = git bisect step, GLM README t100
rounds = 3
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt = write smallest html tetris game
n = 100
args = -c 1024
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=0 max_swap_mb=8000 swapout_pages_s=400000 psi=95
env = LLAMA_MOE_CACHE_DETERMINISTIC=1

[arm BIS]
bin = @BIN@
state = @STATE@

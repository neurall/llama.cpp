; release candidate rc-merge d80382a06, every arm through llama-cli. RC = default (fork on), RC-OFF = --fork off (must equal stock),
; RC-MASK = default with an 8-core CPU mask (-C 0xFF) to exercise the helper-thread masking, S2-CLI = stock bed0a8566 (the floor).
[exp]
name = rc-check
note = release candidate rc-merge: default, --fork off, CPU mask, against stock, same tool
rounds = 3
order = rotate

[models]
q36 = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/rc-check/prompt.txt
n = 100
log_verbosity = 4

[setup]
guard = min_avail_gb=40 max_swap_mb=1500

[arm RC]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/rc-state-RC.ini

[arm RC-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --fork off

[arm RC-MASK]
bin = /p/bw/wt-release-next/build-dev/bin
args = -C 0xFF -t 8 -Cb 0xFF -tb 8
state = /home/o/.claude/jobs/44ecfe4e/tmp/rc-state-MASK.ini

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock

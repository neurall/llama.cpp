; does the gate fusion (fires only on GLM, shape [4,2,1,1]) matter? the same binary (rc-final-fd4c3d2d3 has the switch GGML_CUDA_NO_GATE_FUSE) on GLM 3.0-bit with it on and off,
; the placement forced (cache and stock) so every start runs the same graph, learned state off, page cache of the file released before each start.
[exp]
name = gate-glm
note = GGML_CUDA_NO_GATE_FUSE on/off on GLM, cache and stock placement
rounds = 4
order = rotate

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/gate-glm/prompt.txt
n = 200
log_verbosity = 4
timeout = 1800

[setup]
state = off
guard = min_avail_gb=60 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm C-ON]
bin = /p/bw/rels/rc-final-fd4c3d2d3
env = LLAMA_MOE_AUTO_MODE=cache
free_cache = 1

[arm C-OFF]
bin = /p/bw/rels/rc-final-fd4c3d2d3
env = LLAMA_MOE_AUTO_MODE=cache GGML_CUDA_NO_GATE_FUSE=1
free_cache = 1

[arm S-ON]
bin = /p/bw/rels/rc-final-fd4c3d2d3
env = LLAMA_MOE_AUTO_MODE=stock
free_cache = 1

[arm S-OFF]
bin = /p/bw/rels/rc-final-fd4c3d2d3
env = LLAMA_MOE_AUTO_MODE=stock GGML_CUDA_NO_GATE_FUSE=1
free_cache = 1

; release candidate on GLM-5.3-Flash 3.0-bit (105 GB on a 125 GB machine), every arm llama-cli. Cold first runs are never recorded: the mmap arms (stock, fork off) get one discarded hot-up run, the pinned default arm reads the whole file while loading and needs none (its first start is the tuner measurement start, kept). Page cache of the
; other models dropped first. RC = default, RC-OFF = --fork off, S2-CLI = stock bed0a8566 (the floor).
[exp]
name = rc-glm-hot
note = release candidate on GLM, default and fork off against stock, same tool
rounds = 4
order = fixed
warm = 0

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/rc-glm/prompt.txt
n = 100
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=60 max_swap_mb=8000 swapout_pages_s=400000 psi=40

[arm S2-CLI]
warm = 1
bin = /p/bw/rels/stock-bed0a8566
origin = stock

[arm RC-OFF]
warm = 1
bin = /p/bw/wt-release-next/build-dev/bin
args = --fork off

[arm RC]
bin = /p/bw/wt-release-next/build-dev/bin
state = /home/o/.claude/jobs/44ecfe4e/tmp/rc-state-glm.ini

; every arm through llama-cli (the earlier comparison ran ours through llama-cli and stock/official through llama-completion, which do different work).
; S2-CLI / O134-CLI = stock and official release through llama-cli, S2 = stock through llama-completion (reference), M-OFF = ours through llama-cli.
[exp]
name = same-tool
note = prefill gap with the same program on every arm
rounds = 4
order = rotate

[models]
q36 = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/same-tool/prompt.txt
n = 100
log_verbosity = 4

[setup]
state = off
guard = min_avail_gb=40 max_swap_mb=1500

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock

[arm O134-CLI]
bin = /p/bw/rels/official-b11362/cuda134
origin = stock

[arm S2]
bin = /p/bw/rels/stock-bed0a8566
tool = completion
origin = stock

[arm M-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --moe cache=0

; release candidate on GLM-5.3-Flash 3.0-bit (105 GB on a 125 GB machine), every arm llama-cli. Cold first runs are recorded as temp=cold and left out of the reports: the mmap arms (stock, fork off) get one discarded hot-up run, the pinned default arm reads the whole file while loading and needs none (its first start is the tuner measurement start, kept). Page cache of the
; other models dropped first. RC = default, RC-OFF = --fork off, S2-CLI = stock bed0a8566 (the floor).
[exp]
name = heavy-glm
note = observer GPU counters vs off on GLM 3.0-bit, starts 1-4 with fresh state
rounds = 4
order = fixed

[models]
glm = /m/gl/3/GLM-5.3-Flash-GSQ-RCO-3.0bit.gguf

[workload]
tool = cli
prompt_file = tools/experiments/rc-glm/prompt.txt
n = 100
log_verbosity = 4
timeout = 1800

[setup]
guard = min_avail_gb=60 max_swap_mb=8000 swapout_pages_s=400000 psi=60

[arm GPU]
bin = /p/bw/rels/rc-heavy-b86609318
state = /home/o/.claude/jobs/44ecfe4e/tmp/heavy-state-GPU.ini


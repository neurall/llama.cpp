; same upstream source (bed0a8566), two build recipes: S2 = native build on this machine, S3 = our Docker recipe (rocky8, CUDA 13.2, gcc-toolset-13,
; generic CPU variants, multi-arch CUDA). If S3 is as slow as our own builds, the gap is the build environment, not our code.
[exp]
name = build-recipe
note = upstream stock built natively vs with our Docker recipe, against our build with the fork off
rounds = 4
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf
q36 = /m/q/36/Qwen3.6-35B-A3B-GSQ-hybrid.gguf

[workload]
tool = cli
prompt_file = tools/experiments/build-recipe/prompt.txt
n = 100
log_verbosity = 4

[setup]
state = off
drop_cache = 1
guard = min_avail_gb=40 max_swap_mb=1500

[arm S2]
bin = /p/bw/rels/stock-bed0a8566
tool = completion
origin = stock

[arm S3]
bin = /p/bw/rels/stock-docker-bed0a8566
tool = completion
origin = stock

[arm M-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --moe cache=0

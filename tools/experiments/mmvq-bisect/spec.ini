; is the 1.5% Qwen Next generation gap (ours 65.9-66.0, stock 67.0, also with --fork off) in the cache changes of mmvq.cu / mmvf.cu / mmq.cu?
; BIS = rc-merge with those three files from upstream bed0a8566 (cache path broken, --fork off only), RC-OFF = rc-merge c3859d073, S2-CLI = stock. All llama-cli.
[exp]
name = mmvq-bisect
note = rc-merge with mmvq/mmvf/mmq reverted to upstream vs rc-merge vs stock, --fork off, Qwen Next
rounds = 5
order = rotate

[models]
qn = /m/q/1/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf

[workload]
tool = cli
prompt_file = tools/experiments/mmvq-bisect/prompt.txt
n = 200
log_verbosity = 4

[setup]
guard = min_avail_gb=30 max_swap_mb=4000

[arm BIS]
bin = /p/bw/wt-mmvq/build-dev/bin
args = --fork off
warm = 1

[arm RC-OFF]
bin = /p/bw/wt-release-next/build-dev/bin
args = --fork off
warm = 1

[arm S2-CLI]
bin = /p/bw/rels/stock-bed0a8566
origin = stock
warm = 1

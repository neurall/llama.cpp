name: Fork tooling

# The fork's own Python tooling and docs: no GPU and no model needed. The engine itself is built and tested by the upstream workflows in this directory.
on:
  push:
    paths:
      - 'fork/**'
      - 'README.md'
      - '.github/workflows/fork-ci.yml'
  pull_request:
    paths:
      - 'fork/**'
      - 'README.md'
      - '.github/workflows/fork-ci.yml'

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fork tooling self-test (compile, tool help, simulator invariants, config, markdown links)
        run: python3 fork/run.py selftest
